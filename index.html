<!doctype html>
<html lang="ru" data-catalog-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог данных — подготовка прототипа</title>
    <script>
      // Paint the saved preference before the app (including its optional demo worker) loads.
      (() => {
        try {
          if (localStorage.getItem('data-catalog.theme') !== 'light') return;
          const root = document.documentElement;
          root.dataset.catalogTheme = 'light';
          root.style.colorScheme = 'light';
        } catch { /* The document already has the default dark theme. */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
